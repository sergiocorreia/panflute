# Build and publish panflute to PyPI using Trusted Publishing (OIDC); no
# API tokens or passwords are stored in this repository.
#
# - Publishing a (non-prerelease) GitHub release uploads to PyPI.
# - Publishing a GitHub *prerelease*, or running this workflow manually
#   ("Run workflow" in the Actions tab), uploads to TestPyPI only.
#
# One-time setup and the full release procedure are described in DISTRIBUTION.md.

name: Publish on PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Check that the release tag matches panflute.__version__
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('panflute/version.py')['__version__'])")
          echo "Tag: ${TAG}  panflute version: ${version}"
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Release tag '${TAG}' does not match panflute version '${version}'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/panflute
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1  # zizmor: ignore[unpinned-uses] (branch recommended by PyPA)

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/panflute
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1  # zizmor: ignore[unpinned-uses] (branch recommended by PyPA)
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running for an already uploaded version is not an error on TestPyPI
          skip-existing: true
