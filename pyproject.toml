[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["panflute"]

[tool.setuptools.package-data]
panflute = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "panflute.version.__version__"}

[project]
name = "panflute"
dynamic = ["version"]
description = "Pythonic Pandoc filters"
readme = "README.md"
authors = [{name = "Sergio Correia", email = "sergio.correia@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pandoc", "pandocfilters", "markdown", "latex"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Filters",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "click>=6,<9",
    "pyyaml>=3,<7",
]

[project.optional-dependencies]
extras = [
    "yamlloader>=1,<2",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]
# To build the documentation (docs/source); see CONTRIBUTING.md
docs = [
    "sphinx>=7",
    "myst-parser>=3",  # includes CHANGELOG.md in the docs
]

[project.urls]
Homepage = "https://scorreia.com/software/panflute/"
Documentation = "https://scorreia.com/software/panflute/"
Repository = "https://github.com/sergiocorreia/panflute"
Issues = "https://github.com/sergiocorreia/panflute/issues"
Changelog = "https://github.com/sergiocorreia/panflute/blob/master/CHANGELOG.md"

[project.scripts]
panflute = "panflute:main"
panfl = "panflute:panfl"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# The suite can be run from any directory; see tests/README.md.
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "requires_pandoc: needs a pandoc executable on PATH (skipped otherwise)",
]
filterwarnings = [
    # Deprecations triggered by panflute's own code are errors
    "error::DeprecationWarning:panflute",
    "error::PendingDeprecationWarning:panflute",
]

[tool.coverage.run]
source = ["panflute"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs/build"]

[tool.ruff.lint]
# Deliberately conservative: syntax errors, undefined names, invalid comparisons,
# and redefined imports. Broaden gradually; avoid churn-only rules.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.mypy]
# Checked in CI (lint job). Deliberately not strict: the public API is annotated,
# while many private helpers are left untyped (and their bodies unchecked).
python_version = "3.10"
files = ["panflute", "tests/type_checking"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code", "truthy-bool"]
# Several functions rely on an implicit `return None` at the end
warn_no_return = false

[[tool.mypy.overrides]]
# Optional dependency without type information
module = ["yamlloader", "yamlloader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Names in panflute/__init__.py must be explicitly re-exported ("X as X"),
# so that they are visible to users that type-check with --strict
module = ["panflute"]
implicit_reexport = false

[[tool.mypy.overrides]]
# The sample filter in tests/type_checking is checked as strictly as a user
# could (e.g. calling an unannotated panflute function is an error)
module = ["tests.type_checking.*"]
strict_equality = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
